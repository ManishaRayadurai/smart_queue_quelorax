spring.application.name=quelorax-backend
server.port=8080

# ---------------------------------------------------------------------------
# MySQL — primary datasource.
#
# Local dev quick start:
#   docker compose up -d          (spins up MySQL 8 using docker-compose.yml)
# or point at your own local/managed MySQL instance via the env vars below.
#
#   DB_HOST=localhost  DB_PORT=3306  DB_NAME=quelorax_db
#   DB_USERNAME=root    DB_PASSWORD=root
#
# createDatabaseIfNotExist=true means you don't need to manually CREATE DATABASE
# first — the app will create quelorax_db on first connect if it's missing
# (the connecting user needs CREATE privileges).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quelorax_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10

# ddl-auto=update lets Hibernate create/evolve tables from the @Entity classes
# automatically — convenient in dev, but for a real production rollout switch
# this to "validate" and manage schema changes with a migration tool instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=quelorax-super-secret-key-change-this-in-production-0123456789ABCDEF
app.jwt.expiration-ms=86400000

# CORS - frontend dev server (Vite) origin
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---------------------------------------------------------------------------
# OTP delivery — Email (SMTP)
# Fill these in via environment variables (recommended) or replace the
# ${...:default} values directly. Example for a Gmail App Password:
#   MAIL_HOST=smtp.gmail.com  MAIL_PORT=587
#   MAIL_USERNAME=you@gmail.com  MAIL_PASSWORD=<16-char app password>
# Any standard SMTP provider works too (SendGrid, Amazon SES, Mailgun, etc.)
# If MAIL_USERNAME is left blank, email sending is skipped (see EmailOtpService).
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@quelorax.app}

# ---------------------------------------------------------------------------
# OTP delivery — SMS (Twilio)
# Sign up at https://www.twilio.com, grab the Account SID + Auth Token from
# the console, and buy/verify a "from" number capable of sending SMS.
#   TWILIO_ACCOUNT_SID=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   TWILIO_AUTH_TOKEN=your_auth_token
#   TWILIO_FROM_NUMBER=+15551234567
# If any of these are left blank, SMS sending is skipped (see SmsOtpService).
# Phone numbers submitted by users should be in E.164 format, e.g. +919876543210
# ---------------------------------------------------------------------------
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}

# "Continue with Google" — sign-in
# Create an OAuth Client ID (type "Web application") at
# https://console.cloud.google.com/apis/credentials, add your frontend
# origin (e.g. http://localhost:5173) under "Authorized JavaScript origins",
# then set the SAME client ID here and as VITE_GOOGLE_CLIENT_ID in the
# frontend .env — they must match exactly, or token verification will fail.
#   GOOGLE_CLIENT_ID=xxxxxxxx.apps.googleusercontent.com
app.google.client-id=${GOOGLE_CLIENT_ID:892918437492-nrhfmhlqk1aco4r8rm3tu5n9k541fqt2.apps.googleusercontent.com}
