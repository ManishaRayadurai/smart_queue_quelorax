spring.application.name=queue-service
server.port=8082

# ---------------------------------------------------------------------------
# MySQL — owns: departments, queue_tokens, documents.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quelorax_queue}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Manisha@507
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# JWT — MUST be identical across all services.
app.jwt.secret=quelorax-super-secret-key-change-this-in-production-0123456789ABCDEF
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080

# Where notification-service lives — queue-service calls this on token
# status changes (called next, delayed, missed, completed) so the visitor
# gets an SMS/push about their queue update. See QueueNotificationClient.
app.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}
