spring.application.name=auth-service
server.port=8081

# ---------------------------------------------------------------------------
# MySQL — owns: users, organization, settings, otp_codes.
# Each microservice gets its own database on the same MySQL server; nothing
# else may read this one directly, they go through auth-service's REST API
# instead (see InternalUserController for the service-to-service reads).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quelorax_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Manisha@507
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# JWT — MUST be identical across all services, since each service verifies
# tokens itself rather than calling back to auth-service on every request.
app.jwt.secret=quelorax-super-secret-key-change-this-in-production-0123456789ABCDEF
app.jwt.expiration-ms=86400000

# CORS — frontend dev server (Vite) origin, and the gateway itself in case
# a browser ever calls this service directly during local debugging.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080

# ---------------------------------------------------------------------------
# OTP delivery — Email (SMTP)
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@quelorax.app}

# ---------------------------------------------------------------------------
# OTP delivery — SMS (Twilio)
# ---------------------------------------------------------------------------
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}

# "Continue with Google" — must match VITE_GOOGLE_CLIENT_ID in the frontend .env
app.google.client-id=${GOOGLE_CLIENT_ID:892918437492-nrhfmhlqk1aco4r8rm3tu5n9k541fqt2.apps.googleusercontent.com}
