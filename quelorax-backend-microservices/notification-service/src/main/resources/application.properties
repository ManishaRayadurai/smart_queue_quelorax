spring.application.name=notification-service
server.port=8083

# ---------------------------------------------------------------------------
# MySQL — owns: notifications, notification_read_by, fcm_tokens.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quelorax_notify}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Manisha@507
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# JWT — MUST be identical across all services.
app.jwt.secret=quelorax-super-secret-key-change-this-in-production-0123456789ABCDEF
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080

# ---------------------------------------------------------------------------
# OTP delivery — SMS (Twilio), reused here to push plain-text notification
# alerts to visitors who don't have the app open.
# ---------------------------------------------------------------------------
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ---------------------------------------------------------------------------
# Other services this service talks to (service-to-service, internal-only
# endpoints — see NotificationService.java). Override via env vars in
# docker-compose / k8s where services aren't all on localhost.
# ---------------------------------------------------------------------------
app.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
app.services.queue-url=${QUEUE_SERVICE_URL:http://localhost:8082}
